name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the tag matches the package version
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          src = pathlib.Path("src/cascade_guard/__init__.py").read_text()
          version = re.search(r'__version__ = "([^"]+)"', src).group(1)
          if tag != version:
              sys.exit(f"tag {tag!r} does not match __version__ {version!r}")
          print(f"tag and version agree: {version}")
          PY

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install cyclonedx-bom
          python -m cyclonedx_py environment --output-format json --outfile dist/sbom.cdx.json

      - name: Compute SLSA subject hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum *.whl *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  provenance:
    name: SLSA provenance
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    # Generates a signed, verifiable statement of how these artifacts were built.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  publish:
    name: Publish to PyPI
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cascade-guard
    permissions:
      # PyPI Trusted Publishing (OIDC) — no long-lived API token in CI.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Remove non-distribution files before upload
        run: rm -f dist/sbom.cdx.json

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  sign:
    name: Sign and attach release assets
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: dist/*.whl dist/*.tar.gz

      - name: Attach artifacts, signatures, and SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
