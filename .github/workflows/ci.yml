name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest

      - name: Smoke-test the CLI end to end
        shell: bash
        run: |
          cascade-guard demo --dir demo_output --runtime
          cascade-guard analyze demo_output/demo_gangup.jsonl \
            --wrong-answer blue --json out.json --quiet --no-policy
          cascade-guard guard demo_output/demo_gangup.jsonl --no-policy
          cascade-guard analyze demo_output/demo_gangup.jsonl --no-policy \
            --baseline .cascade-guard/baseline.jsonl --record-baseline --quiet
          cascade-guard fleet --baseline .cascade-guard/baseline.jsonl --out fleet.html

  no-dependencies:
    name: verify the core has no runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without extras
        run: python -m pip install .
      - name: Assert nothing but cascade-guard was installed
        run: |
          python - <<'PY'
          import importlib.metadata as md
          extra = {
              d.metadata["Name"].lower()
              for d in md.distributions()
              if d.metadata["Name"]
          } - {"cascade-guard", "pip", "setuptools", "wheel"}
          assert not extra, f"unexpected runtime dependencies installed: {sorted(extra)}"
          print("core install is dependency-free")
          PY
      - name: The CLI must work with no optional packages present
        run: cascade-guard demo --dir /tmp/demo --runtime

  security:
    name: security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static security analysis
        run: |
          python -m pip install bandit[sarif]
          bandit -r src -f sarif -o bandit.sarif || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
        continue-on-error: true
