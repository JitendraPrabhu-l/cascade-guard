[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cascade-guard"
version = "0.2.0"
description = "Multi-agent reliability profiler and runtime guard: detect sycophancy cascades, false consensus, and error propagation in LLM agent traces."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jitendra Prabhu", email = "jitendraprabhul@gmail.com" }]
keywords = [
    "llm",
    "agents",
    "multi-agent",
    "evaluation",
    "observability",
    "sycophancy",
    "langgraph",
    "reliability",
    "guardrails",
    "ai-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Core is intentionally dependency-free (stdlib only).
dependencies = []

[project.optional-dependencies]
judge = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
cascade-guard = "cascade_guard.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/jitendraprabhu/cascade-guard"
Documentation = "https://github.com/jitendraprabhu/cascade-guard#readme"
Changelog = "https://github.com/jitendraprabhu/cascade-guard/blob/main/CHANGELOG.md"
Issues = "https://github.com/jitendraprabhu/cascade-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade_guard"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/cascade_guard"]
warn_unused_ignores = false

# Optional integrations are imported lazily and guarded by try/except, so they
# are legitimately absent in a core (or dev) install. Type-checking must not
# require installing every extra.
[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "yaml"]
ignore_missing_imports = true
